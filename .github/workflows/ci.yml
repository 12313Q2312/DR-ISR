name: tests-and-smoke
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python run.py --config configs/smoke.json --output results/ci-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: smoke-evidence
          path: results/ci-smoke
  neural-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements-neural.txt
      - run: python -m pip install -r requirements-neural.txt
      - run: python run_neural.py --config configs/neural_smoke.json --output results/ci-neural-smoke
      - run: python verify_neural.py results/ci-neural-smoke
      - run: python verify_neural.py evidence/neural-v1
      - uses: actions/upload-artifact@v4
        with:
          name: neural-smoke-evidence
          path: results/ci-neural-smoke
